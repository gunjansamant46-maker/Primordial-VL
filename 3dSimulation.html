<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Simulations - Eurica</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: 'bg.gif';
}

/* HEADINGS */
h1 {
    margin-top: 20px;
}

h2 {
    margin-top: 40px;
}

/* CONTAINERS */
.comparison-frame, .single-frame {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

/* MODEL BOX */
.model-box {
    background: white;
    margin: 15px;
    padding: 10px;
    border-radius: 10px;
    width: 320px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.full-width {
    width: 700px;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 250px;
    border: none;
}

/* TABS */
.tab-buttons {
    margin: 20px;
}

.tab-buttons button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    background: 'bg.gif'
    border-radius: 5px;
    cursor: pointer;
}

.tab-buttons button:hover {
    background: #45a049;
}

/* HIDE MODULES */
.hidden {
    display: none;
}

/* BACK BUTTON */
.back-btn {
    display: inline-block;
    margin: 30px;
    padding: 10px 20px;
    background: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}
</style>

<script>
function hideAll() {
    document.getElementById("nephron").classList.add("hidden");
    document.getElementById("genetic").classList.add("hidden");
    document.getElementById("skeleton").classList.add("hidden");
}

function showNephron() {
    hideAll();
    document.getElementById("nephron").classList.remove("hidden");
}

function showGenetic() {
    hideAll();
    document.getElementById("genetic").classList.remove("hidden");
}

function showSkeleton() {
    hideAll();
    document.getElementById("skeleton").classList.remove("hidden");
}
</script>

</head>

<body>

<h1>🧬 3D Simulations Lab</h1>

<!-- ================= BASIC ================= -->

<h2>🔬 Animal Cell vs Plant Cell</h2>

<div class="comparison-frame">

    <div class="model-box">
        <h3>Animal Cell</h3>
        <iframe src="https://sketchfab.com/models/abaa9a651c834cdaa67072b32fb0024f/embed" allowfullscreen></iframe>
    </div>

    <div class="model-box">
        <h3>Plant Cell</h3>
        <iframe src="https://sketchfab.com/models/e61e7bdf8c8449a583b364f05e70289b/embed" allowfullscreen></iframe>
    </div>

</div>

<h2>🌸 Reproductive Parts in Plants</h2>

<div class="single-frame">
    <div class="model-box full-width">
        <iframe src="https://sketchfab.com/models/4ce0afd091d742e286a0de156e183d95/embed" allowfullscreen></iframe>
    </div>
</div>

<!-- ================= INTERMEDIATE ================= -->

<h2>🧠 Intermediate Simulations</h2>

<div class="tab-buttons">
    <button onclick="showNephron()">Nephron</button>
    <button onclick="showGenetic()">Genetic Material</button>
    <button onclick="showSkeleton()">Skeletal System</button>
</div>

<div id="nephron" class="model-box hidden">
    <iframe src="https://sketchfab.com/models/898146d60a0741c6ac9910210e4eac20/embed" allowfullscreen></iframe>
</div>

<div id="genetic" class="model-box hidden">
    <iframe src="https://sketchfab.com/models/cc33bb1ebe6141b08d0d06f1bbebc2b7/embed" allowfullscreen></iframe>
</div>

<div id="skeleton" class="model-box hidden">
    <iframe src="https://sketchfab.com/models/a16faac00e9944f7a80ed390844e221f/embed" allowfullscreen></iframe>
</div>

<a href="index.html" class="back-btn">⬅ Back to Home</a>

<script src="chatbot.js"></script>

</body>
</html>
